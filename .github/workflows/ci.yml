  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrations and database tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        # Bootstrap of the golden schema: when ci/expected/schema.sql is absent, this run generates
        # it, uploads it as an artifact for review, and still fails — the merge stays blocked until
        # a person commits the reviewed file. Once on main, regen-expected.yml is the regeneration path.
        run: |
          if [ ! -f ci/expected/schema.sql ]; then
            LEDGERDESK_WRITE_EXPECTED=yes bash ci/db_check.sh
            echo "::error::ci/expected/schema.sql was missing. It was generated in this run and uploaded as an artifact; review the file and commit it."
            exit 1
          fi
          bash ci/db_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expected-schema
          path: ci/expected/schema.sql
          if-no-files-found: ignore
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own service container rather than a step inside the db job: both scripts drop the
    # cluster-wide roles the migration set creates, so sharing one cluster would make each run
    # depend on the order of the other.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Build the consoles and run the application tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash ci/app_check.sh
      # A step of this job rather than a job of its own: the chokepoint's tests need the installed
      # dependencies, which the db job does not have, and a database, which the check job does not
      # have. They run after app_check.sh and not beside it because both scripts drop the same
      # cluster-wide roles, so sharing one cluster only works in sequence.
      - name: Model chokepoint checks
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash ci/gateway_check.sh
