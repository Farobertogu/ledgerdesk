name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repository structure check
        run: bash ci/check.sh
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [reading-foundations, intake-reception-behavior, intake-reception-recovery, intake-reception-mutations, intake-extraction, intake-extraction-recovery, intake-extraction-admission, intake-extraction-boundaries, intake-extraction-resource-guards, intake-extraction-format-guards, intake-preparation-behavior, intake-preparation-admission, intake-preparation-guards]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require every producer result
        if: ${{ always() }}
        env:
          READING_NEEDS: ${{ toJSON(needs) }}
          READING_JOB_STATUS: ${{ job.status }}
        run: node ci/reading_result_gate.mjs
  reading-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Service tests own an isolated PG16 Compose project; no destructive legacy scripts.
    # The boundary uses the installed TypeScript parser, not a second hand-written TSX parser.
    env:
      LEDGERDESK_READING_TRIAL: '0'
      LEDGERDESK_DEV_IDENTITY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/intake/t02/test_ci_wiring.mjs
      - run: node ci/intake_ci_check.mjs
      - run: node ci/reading_boundary_check.mjs
      - run: npm run test:reading
      - run: npm run test:reading:viewer
      - run: npm run test:reading:harness
      - run: npm run test:reading:policy
      - run: npm run test:reading:lifecycle
      - run: npm run test:reading:origins
      - run: npm run test:reading:mutations
      # Keep the credential-free assertions and M5 above unchanged; session/1 has its own negatives.
      - run: node ci/access_boundary_check.mjs
      - run: npm run test:access
      - run: npm run test:access:browser
      - run: npm run test:access:runtime:unit
      - run: npm run test:access:canonical
      - run: npm run test:access:reading:unit
      - run: npm run test:access:administration:unit
      - run: npm run test:access:journey:unit
      - run: node --test --test-concurrency=1 tests/access/test_runtime_packaging.mjs
      - run: node ci/intake_boundary_check.mjs
      - run: npm run test:intake
      - run: npm run test:intake:storage
      - run: npm run test:intake:recovery
      - run: npm run test:intake:isolation
      - run: npm run test:intake:limits
      - run: npm run test:intake:lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-foundation-evidence
          path: test-results/intake-t01/
          if-no-files-found: ignore
      # This owns a fresh, separately named PG16 Compose project; no historical DB scripts.
      - run: npm run test:reading:service
      - run: npm run typecheck
      - run: npm run typecheck:app
      - run: npm run build
      - run: npm run test:reading:http
      - run: npx playwright install --with-deps chromium
      - run: npm run test:reading:browser
      - run: npm run test:reading:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-integration-screenshots
          path: test-results/reading-integration/
          if-no-files-found: ignore
  intake-reception-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEDGERDESK_READING_TRIAL: '0'
      LEDGERDESK_DEV_IDENTITY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix ci/intake/reception --ignore-scripts --no-audit --no-fund
      - run: node --test tests/intake/t02/test_ci_wiring.mjs
      - run: node ci/intake_ci_check.mjs
      - run: node ci/intake_t02_matrix.mjs --suite behavior
      - name: Prepare bounded public evidence
        if: always()
        run: node ci/intake_t02_artifacts.mjs --job behavior
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-reception-behavior-evidence
          path: test-results/intake-t02-public/behavior/
          if-no-files-found: error
