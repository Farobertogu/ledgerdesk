name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repository structure check
        run: bash ci/check.sh
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Service tests own an isolated PG16 Compose project; no destructive legacy scripts.
    # The boundary uses the installed TypeScript parser, not a second hand-written TSX parser.
    env:
      LEDGERDESK_READING_TRIAL: '0'
      LEDGERDESK_DEV_IDENTITY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node ci/reading_boundary_check.mjs
      - run: npm run test:reading
      - run: npm run test:reading:viewer
      - run: npm run test:reading:harness
      - run: npm run test:reading:policy
      - run: npm run test:reading:lifecycle
      - run: npm run test:reading:origins
      - run: npm run test:reading:mutations
      # Keep the credential-free assertions and M5 above unchanged; session/1 has its own negatives.
      - run: node ci/access_boundary_check.mjs
      - run: npm run test:access
      - run: npm run test:access:browser
      - run: npm run test:access:runtime:unit
      - run: npm run test:access:canonical
      - run: npm run test:access:runtime
      - run: npm run test:access:invitations
      - run: npm run test:access:reading:unit
      - run: npm run test:access:reading
      - run: npm run test:access:administration:unit
      - run: npm run test:access:administration
      - run: npm run test:access:journey:unit
      - run: npm run test:access:journey
      # This owns a fresh, separately named PG16 Compose project; no historical DB scripts.
      - run: npm run test:reading:service
      - run: npm run typecheck:app
      - run: npm run build
      - run: npm run test:reading:http
      - run: npx playwright install --with-deps chromium
      - run: npm run test:reading:browser
      - run: npm run test:reading:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-integration-screenshots
          path: test-results/reading-integration/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-runtime-evidence
          path: test-results/access-runtime/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-invitations-evidence
          path: test-results/access-invitations/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-reading-evidence
          path: test-results/access-reading/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-administration-evidence
          path: test-results/access-administration/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-journey-evidence
          path: test-results/access-journey/
          if-no-files-found: ignore
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrations and database tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        # Bootstrap of the golden schema: when ci/expected/schema.sql is absent, this run generates
        # it, uploads it as an artifact for review, and still fails — the merge stays blocked until
        # a person commits the reviewed file. Once on main, regen-expected.yml is the regeneration path.
        run: |
          if [ ! -f ci/expected/schema.sql ]; then
            LEDGERDESK_WRITE_EXPECTED=yes bash ci/db_check.sh
            echo "::error::ci/expected/schema.sql was missing. It was generated in this run and uploaded as an artifact; review the file and commit it."
            exit 1
          fi
          bash ci/db_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expected-schema
          path: ci/expected/schema.sql
          if-no-files-found: ignore
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own service container rather than a step inside the db job: both scripts drop the
    # cluster-wide roles the migration set creates, so sharing one cluster would make each run
    # depend on the order of the other.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Build the consoles and run the application tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash ci/app_check.sh
      # A step of this job rather than a job of its own: the chokepoint's tests need the installed
      # dependencies, which the db job does not have, and a database, which the check job does not
      # have. They run after app_check.sh and not beside it because both scripts drop the same
      # cluster-wide roles, so sharing one cluster only works in sequence.
      - name: Model chokepoint checks
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash ci/gateway_check.sh
