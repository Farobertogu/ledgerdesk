name: regen-expected
# Regenerates ci/expected/schema.sql from a clean application of the migration set, with the same
# PostgreSQL and pg_dump versions the ci workflow uses. Manual trigger only: the regenerated file
# comes back as an artifact, is reviewed as a diff, and is committed by a person — never by CI.
on:
  workflow_dispatch:
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Regenerate the expected schema
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          LEDGERDESK_WRITE_EXPECTED: 'yes'
        run: bash ci/db_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expected-schema
          path: ci/expected/schema.sql
          if-no-files-found: error
